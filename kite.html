<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TrueFlow · Kite Login</title>
<style>
  :root{--bg:#0f1117;--card:#171a23;--border:#252a36;--text:#e8ecf3;--muted:#8b94a7;--green:#22c55e;--cyan:#38bdf8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 20px;text-align:center}
  .logo{font-weight:800;letter-spacing:.5px;font-size:14px;color:var(--cyan);margin-bottom:4px}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .tokbox{background:#0b0e15;border:1px dashed var(--border);border-radius:12px;padding:14px;margin:14px 0;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;word-break:break-all;color:var(--green)}
  button{width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;
         background:var(--green);color:#04140a;transition:transform .05s}
  button:active{transform:scale(.98)}
  .steps{text-align:left;color:var(--muted);font-size:13px;line-height:1.7;margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
  .steps b{color:var(--text)}
  .err{color:#f87171;font-size:15px;line-height:1.6}
  .ok-badge{font-size:44px;margin-bottom:6px}
  code{background:#0b0e15;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--cyan);font-size:12px}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">TRUEFLOW</div>
    <div id="content"></div>
  </div>

<script>
  // Display-only. Reads the token from the URL and shows it. Sends nothing anywhere.
  (function(){
    var params = new URLSearchParams(window.location.search);
    var token  = params.get("request_token");
    var status = params.get("status");
    var content = document.getElementById("content");

    if (token && (status === "success" || status === null)) {
      var cmd = "/login " + token;
      content.innerHTML =
        '<div class="ok-badge">&#x2705;</div>' +
        '<h1>Kite Login Captured</h1>' +
        '<div class="sub">Copy the command below and paste it to <b>@TrueFlowAI_bot</b>.</div>' +
        '<div class="tokbox" id="tok">' + cmd + '</div>' +
        '<button id="copyBtn">&#x1F4CB;&nbsp; Copy &nbsp;<code>/login &lt;token&gt;</code></button>' +
        '<div class="steps">' +
          '<div><b>1.</b> Tap <b>Copy</b> above.</div>' +
          '<div><b>2.</b> Open <b>@TrueFlowAI_bot</b> in Telegram.</div>' +
          '<div><b>3.</b> Paste &amp; send. Engine starts itself.</div>' +
        '</div>';

      document.getElementById("copyBtn").addEventListener("click", function(){
        var btn = this;
        function done(){ btn.innerHTML = "&#x2705;&nbsp; Copied \u2014 paste in Telegram"; btn.style.background = "#16a34a"; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cmd).then(done, fallback);
        } else { fallback(); }
        function fallback(){
          var r = document.createRange(); r.selectNode(document.getElementById("tok"));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          try { document.execCommand("copy"); done(); } catch(e){}
          s.removeAllRanges();
        }
      });
    } else {
      content.innerHTML =
        '<h1>Login not completed</h1>' +
        '<div class="err">No valid request token found in this link.<br>' +
        'Please open the Kite login link again and approve.</div>';
    }
  })();
</script>
</body>
</html>
